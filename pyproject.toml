[project]
name = "agentcode"
version = "0.1.0"
description = "可扩展的 Python 智能体框架（ReAct / Plan-and-Solve / Reflection）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "serpapi>=0.1.5",
    "rich>=13.7.0",
]

[project.scripts]
agentcode = "agentcode.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
