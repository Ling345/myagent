<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentCode 运行追踪</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="tr-body">
    <div class="flow" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>

    <main class="tr-page">
      <header class="tr-page-head">
        <div>
          <h1>运行追踪</h1>
          <p class="tr-sub">
            排查视图：这里会显示推理、工具调用与观察结果；普通对话页仍然只给结果。
            运行记录在内存里保留约 30 分钟，服务重启后消失。
          </p>
        </div>
        <a class="tr-back" href="/">← 回到对话</a>
      </header>

      <div class="tr-layout">
        <aside class="tr-column">
          <p class="sidebar-label tr-runs-head">
            <span>最近的运行</span>
            <button type="button" id="tr-refresh" class="tr-refresh">刷新</button>
          </p>
          <div id="tr-runs" class="tr-runs"></div>
        </aside>

        <section class="tr-column">
          <header class="tr-head">
            <h2 id="tr-title">选择左边的一次运行</h2>
            <p id="tr-meta" class="tr-sub"></p>
          </header>
          <p id="tr-status" class="composer-hint" role="status" aria-live="polite"></p>
          <ol id="tr-steps" class="tr-steps"></ol>
          <div id="tr-answer" class="tr-answer" hidden></div>
        </section>
      </div>
    </main>

    <script src="/static/trace.js"></script>
  </body>
</html>
