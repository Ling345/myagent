<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentCode 智能体</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="login" id="login" hidden>
      <form class="login-card" id="login-form">
        <h2>登录 AgentCode</h2>
        <p class="login-hint">用管理员分配给你的账号登录。没有账号时，请管理员执行
          <code>agentcode user add 你的名字</code>。</p>
        <label for="login-name">账号</label>
        <input id="login-name" name="name" autocomplete="username" required />
        <label for="login-password">密码</label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit" class="primary" id="login-button">登录</button>
        <p class="login-error" id="login-error" role="alert"></p>
      </form>
    </div>

    <div class="flow" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>

    <div class="app">
      <aside class="sidebar">
        <button type="button" id="new-session-button" class="new-chat">＋ 新会话</button>

        <p class="sidebar-label">会话</p>
        <div id="session-list" class="session-list"></div>

        <p class="sidebar-label">智能体</p>
        <div id="agent-list" class="agent-list"></div>

        <div class="account" id="account" hidden>
          <span class="account-name" id="account-name"></span>
          <span class="account-quota" id="account-quota"></span>
          <button type="button" id="billing-toggle" class="link">套餐与用量</button>
          <button type="button" id="logout-button" class="link">退出</button>
        </div>

        <section id="billing-panel" class="billing-panel" hidden>
          <header class="billing-head">
            <strong id="billing-plan">—</strong>
            <span id="billing-expiry" class="billing-expiry"></span>
            <button type="button" id="billing-close" class="icon" aria-label="关闭">✕</button>
          </header>
          <div class="billing-usage">
            <div class="billing-bar"><span id="billing-bar-fill"></span></div>
            <p id="billing-usage-text" class="billing-usage-text"></p>
          </div>
          <div class="billing-plans" id="billing-plans"></div>
          <ul class="billing-orders" id="billing-orders"></ul>
        </section>
      </aside>

      <main class="chat">
        <header class="chat-head">
          <span class="chat-title">AgentCode</span>
          <span id="chat-sub" class="chat-sub"></span>
        </header>

        <div id="messages" class="messages">
          <div id="empty" class="welcome">
            <h2>把任务交给智能体</h2>
            <p>左侧选一个智能体，写下任务。它会记住这个会话里的上下文，追问时不必重复背景。</p>
            <div class="samples">
              <button
                type="button"
                class="sample"
                data-agent="react"
                data-task="查一下北京今天的天气，再推荐一个景点"
              >
                查天气并推荐景点
              </button>
              <button
                type="button"
                class="sample"
                data-agent="coding"
                data-task="实现 is_prime(n) 判断素数，并写 pytest 测试覆盖 2、3、4、9、13"
              >
                写代码并跑通测试
              </button>
              <button
                type="button"
                class="sample"
                data-agent="plan_and_solve"
                data-task="周一卖出 15 个苹果，周二翻倍，周三比周二少 5 个，三天共卖出多少"
              >
                分步解一道计算题
              </button>
              <button
                type="button"
                class="sample"
                data-agent="reflection"
                data-task="写一个找出 1 到 n 之间所有素数的函数，并说明算法复杂度"
              >
                写函数并自我评审
              </button>
            </div>
          </div>
        </div>

        <form id="run-form" class="composer" novalidate>
          <div class="composer-box">
            <textarea
              id="task"
              name="task"
              rows="1"
              placeholder="给智能体一个任务，回车发送，Shift+回车换行"
            ></textarea>
            <button type="submit" id="send-button" class="send" aria-label="运行">↑</button>
          </div>
          <p id="run-status" class="composer-hint" role="status" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
