<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentCode 智能体</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="rail">
        <header class="brand">
          <h1>AgentCode</h1>
          <p class="brand-note">选一个智能体，直接看结果</p>
        </header>

        <form id="run-form" class="controls" novalidate>
          <fieldset class="group">
            <legend>智能体</legend>
            <div id="agent-list" class="agent-list"></div>
          </fieldset>

          <div class="group">
            <label class="group-label" for="task">任务</label>
            <textarea
              id="task"
              name="task"
              rows="4"
              placeholder="例如：查一下北京今天的天气，再推荐一个景点"
            ></textarea>
          </div>

          <button type="submit" id="run-button" class="primary">运行</button>
          <p id="run-status" class="run-status" role="status" aria-live="polite"></p>

          <div class="rail-actions">
            <button type="button" id="new-session-button" class="ghost">新会话</button>
          </div>
          <p class="hint" id="session-hint"></p>
        </form>

        <footer class="rail-foot">
          <dl id="config-list" class="config"></dl>
        </footer>
      </aside>

      <main class="stream">
        <div class="empty" id="empty">
          <p>在左侧选一个智能体，写下任务，然后点运行。</p>
          <p class="hint">结果会显示在这里；这个标签页里的追问会自动带上之前的上下文。</p>
        </div>

        <section class="answer" id="answer" hidden>
          <p class="annotation">最终答案</p>
          <p class="answer-text" id="answer-text"></p>
          <p class="meta" id="answer-meta"></p>
        </section>

        <section class="failure" id="failure" hidden>
          <p class="annotation">没能完成</p>
          <p id="failure-text"></p>
        </section>

        <div class="stream-actions">
          <button type="button" id="export-button" class="ghost" disabled>导出完整结果 JSON</button>
          <button type="button" id="clear-button" class="ghost">清空</button>
        </div>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
